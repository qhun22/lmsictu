{% load static %}
<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tạo môn học | QHUN22" />
    <title>Tạo môn học | QHUN22</title>

    <!-- Google Fonts: Signika -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Signika:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="{% static 'assets/css/navbar.css' %}?v=20260818-1"
    />
    <link
      rel="stylesheet"
      href="{% static 'assets/css/tao-mon-hoc.css' %}?v=20260819-9"
    />
    <link
      rel="stylesheet"
      href="{% static 'assets/css/toast.css' %}?v=20260818-1"
    />
    <link
      rel="stylesheet"
      href="{% static 'assets/css/confirm.css' %}?v=20260818-1"
    />
  </head>
  <body class="tiao-mon-hoc-body">
    <!-- ── STICKY HEADER ── -->
    <header class="smh-header" role="banner">
      <div class="smh-header-inner">
        <a
          href="{% url 'home' %}"
          class="smh-back"
          aria-label="Quay lại trang chủ"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m15 18-6-6 6-6" />
          </svg>
        </a>
        <h1 class="smh-title">Tạo môn học</h1>
      </div>
    </header>

    <main class="smh-main">
      <!-- ── 2-COLUMN LAYOUT ── -->
      <div class="smh-layout">
        <!-- ╔══════════════════════════════════════╗ -->
        <!-- ║  CỘT TRÁI: Tạo môn học               ║ -->
        <!-- ╚══════════════════════════════════════╝ -->
        <aside class="smh-col smh-col--create">
          <div class="smh-create-card">
            <!-- Count badge -->
            <div class="smh-count">
              <span class="smh-count-num" id="smh-count-num">0</span>
              <span class="smh-count-label">Môn học</span>
            </div>

            <!-- Create form -->
            <form id="smh-form" class="smh-form" autocomplete="off" novalidate>
              <label for="smh-input" class="smh-form-label">
                Thêm môn học mới
              </label>
              <div class="smh-form-row">
                <input
                  id="smh-input"
                  type="text"
                  class="smh-input"
                  placeholder="Ví dụ: Toán học"
                  maxlength="80"
                  autocomplete="off"
                />
                <button type="submit" class="smh-btn smh-btn--primary">
                  Thêm
                </button>
              </div>
            </form>
          </div>
        </aside>

        <!-- ╔══════════════════════════════════════╗ -->
        <!-- ║  CỘT PHẢI: Danh sách môn học         ║ -->
        <!-- ╚══════════════════════════════════════╝ -->
        <section class="smh-col smh-col--list" aria-label="Danh sách môn học">
          <div class="smh-list-header">
            <h2 class="smh-section-title">Danh sách môn học</h2>
          </div>

          <ul id="smh-list" class="smh-list"></ul>

          <!-- ── EMPTY STATE ── -->
          <div id="smh-empty" class="smh-empty" aria-live="polite">
            <div class="smh-empty-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
              </svg>
            </div>
            <p class="smh-empty-title">Chưa có môn học nào</p>
            <p class="smh-empty-sub">Nhập tên môn học bên trái để bắt đầu</p>
          </div>
        </section>
      </div>
      <!-- /smh-layout -->
    </main>

    <script src="{% static 'assets/js/toast.js' %}?v=20260818-1"></script>
    <script src="{% static 'assets/js/confirm.js' %}?v=20260818-1"></script>
    <script src="{% static 'assets/js/tao-mon-hoc.js' %}?v=20260819-9"></script>
  </body>
</html>
