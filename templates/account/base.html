{% load static %}
<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Tài khoản{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Signika:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link
      rel="stylesheet"
      href="{% static 'assets/css/navbar.css' %}?v=20260820-2"
    />
    <link
      rel="stylesheet"
      href="{% static 'assets/css/z1.css' %}?v=20260815-1"
    />
    <link
      rel="stylesheet"
      href="{% static 'assets/css/z2.css' %}?v=20260815-1"
    />
    <link
      rel="stylesheet"
      href="{% static 'assets/css/toast.css' %}?v=20260815-1"
    />
    <link
      rel="stylesheet"
      href="{% static 'assets/css/account.css' %}?v=10006"
    />

    <style>
      .navbar_top-link {
        color: var(--base-color-brand--grey3);
        transition: color 0.25s ease-in-out;
      }
      .navbar_top-link:hover {
        color: var(--base-color-brand--blue) !important;
      }

      .page-wrapper {
        background: #eaf2ff;
        min-height: 100vh;
      }

      .auth-shell {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: calc(100vh - 6rem);
        padding: 7rem 1rem 2rem;
      }
    </style>

    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <div class="page-wrapper">
      {% include 'includes/navbar.html' %}

      <main class="auth-shell">{% block content %}{% endblock %}</main>
    </div>

    {% if messages %}
    <script>
      window.__TOAST_FLASH__ = [
        {% for message in messages %}
        {
          type: "{{ message.tags|default:'info' }}",
          title: {% if message.level_tag == 'error' %}"Lỗi"{% elif message.level_tag == 'success' %}"Thành công"{% elif message.level_tag == 'warning' %}"Cảnh báo"{% else %}"Thông tin"{% endif %},
          message: "{{ message|escapejs }}",
          duration_ms: 5000
        }{% if not forloop.last %},{% endif %}
        {% endfor %}
      ];
    </script>
    {% endif %}

    <script src="{% static 'assets/js/toast.js' %}"></script>
    <script src="{% static 'assets/js/z1.js' %}"></script>
    <script src="{% static 'assets/js/z2.js' %}"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
