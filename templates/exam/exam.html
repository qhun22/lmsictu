{% load static %}
<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ quiz.title|default:'Bài thi' }}</title>
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Signika:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{% static 'assets/css/exam.css' %}?v=20260912"
    />
  </head>
  <body>
    <div class="exam-container">
      <header class="exam-header">
        <span class="exam-user"
          >{{ request.user.username|default:'Username' }}</span
        >
        <span class="exam-timer" id="exam-timer">00:00</span>
        <a class="exam-exit" href="/">Thoát</a>
      </header>

      <main class="exam-content">
        <div class="question-card" id="question-card">
          <div class="question-header">
            <span class="question-num" id="question-num">Câu 1</span>
            <span class="question-type" id="question-type">1 đáp án đúng</span>
          </div>
          <p class="question-text" id="question-text"></p>
          <div class="answer-list" id="answer-list"></div>
        </div>

        <div class="exam-nav">
          <span class="exam-subject"
            >Môn học{% if quiz.subject %}: {{ quiz.subject }}{% endif %}</span
          >
          <button
            type="button"
            class="btn-nav btn-nav-menu"
            id="btn-prev"
            aria-label="Mở danh sách câu hỏi"
            title="Danh sách câu hỏi"
          >
            ☰
          </button>
          <div class="nav-dots" id="nav-dots"></div>
          <button
            type="button"
            class="btn-nav btn-nav-next"
            id="btn-next"
            aria-label="Câu tiếp"
          >
            →
          </button>
          <button type="button" class="btn-nop" id="btn-submit">Nộp bài</button>
        </div>
      </main>
    </div>

    <div class="question-drawer-backdrop" id="question-drawer-backdrop"></div>
    <aside
      class="question-drawer"
      id="question-drawer"
      aria-hidden="true"
      aria-label="Danh sách câu hỏi"
    >
      <div class="question-drawer-header">
        <h2>Danh sách câu hỏi</h2>
        <button
          type="button"
          class="question-drawer-close"
          id="question-drawer-close"
          aria-label="Đóng danh sách câu hỏi"
        >
          ×
        </button>
      </div>
      <div class="question-drawer-list" id="question-drawer-list"></div>
    </aside>

    <!-- Submit Modal -->
    <div class="modal-overlay" id="modal-submit" hidden>
      <div class="modal-box">
        <h2 class="modal-title">Nộp bài?</h2>
        <p class="modal-text">
          Bạn đã trả lời <strong id="modal-answered">0</strong>/<span
            id="modal-total"
            >{{ quiz.questions|length }}</span
          >
          câu.
        </p>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="modal-cancel">
            Hủy
          </button>
          <button type="button" class="btn-confirm" id="modal-confirm">
            Nộp ngay
          </button>
        </div>
      </div>
    </div>

    <!-- Result Modal -->
    <div class="modal-overlay" id="modal-result" hidden>
      <div class="modal-box modal-result">
        <div class="result-icon" id="result-icon"></div>
        <h2 class="result-title" id="result-title">Kết quả</h2>
        <div class="result-score">
          <span class="score-num" id="result-score">0</span>
          <span class="score-max">/ 10</span>
        </div>
        <p class="result-detail" id="result-detail"></p>
        <button type="button" class="btn-confirm" id="btn-close-result">
          Đóng
        </button>
      </div>
    </div>

    <script>
      window.__QUIZ_DATA__ = {{ quiz_json|safe }};
      window.__QUIZ_CODE__ = '{{ quiz.code }}';
    </script>
    <script src="{% static 'assets/js/exam.js' %}?v=20260907"></script>
  </body>
</html>
